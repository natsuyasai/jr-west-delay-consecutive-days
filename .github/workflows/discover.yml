name: Discover delay site structure (temporary)

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/daily-results-calendar-mh8kty
    paths:
      - .github/workflows/discover.yml
      - scripts/discover.py

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dump pages
        run: python scripts/discover.py
