name: Daily delay data update

on:
  schedule:
    # 04:00 JST, before the first trains depart. Cron is in UTC (JST-9).
    - cron: "0 19 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - claude/daily-results-calendar-mh8kty
    paths:
      - .github/workflows/daily.yml
      - scripts/fetch_delay.py
      - scripts/generate_site.py
      - docs/index.html

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch delay data
        run: python scripts/fetch_delay.py

      - name: Generate site data
        run: python scripts/generate_site.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data docs
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update delay data ($(date -u +%Y-%m-%d))"
            git push
          fi

      # continue-on-error: until GitHub Pages is enabled (Settings > Pages >
      # Build and deployment > Source: GitHub Actions) these steps 404; the
      # data fetch/commit above is the important part and should still be
      # considered a success on its own.
      - name: Setup Pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
